name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: PHPCS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2
      - uses: ramsey/composer-install@v3
      - run: composer lint

  syntax:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint every PHP file
        run: |
          find wordpress tests tools -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l

  test:
    name: PHPUnit (WP ${{ matrix.wordpress }}, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.1', wordpress: '6.7' }
          - { php: '8.3', wordpress: '6.7' }
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      WP_TESTS_DIR: /tmp/wordpress-tests-lib
      WP_CORE_DIR: /tmp/wordpress
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          coverage: none
          tools: composer:v2
      - uses: ramsey/composer-install@v3
      - name: Install the WordPress test environment
        run: |
          bash tools/ci/install-wp-tests.sh wordpress_test root root 127.0.0.1 ${{ matrix.wordpress }}
      - name: Run unit tests
        run: set -o pipefail; composer test:unit 2>&1 | tee "$RUNNER_TEMP/unit.out"
      - name: Upload unit test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phpunit-unit-logs-php${{ matrix.php }}
          path: ${{ runner.temp }}/unit.out
          retention-days: 7
          if-no-files-found: ignore
      - name: Run security tests
        run: set -o pipefail; composer test:security 2>&1 | tee "$RUNNER_TEMP/security.out"
      - name: Upload security test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phpunit-security-logs-php${{ matrix.php }}
          path: ${{ runner.temp }}/security.out
          retention-days: 7
          if-no-files-found: ignore
      - name: Publish test counts to step summary
        if: always()
        run: |
          {
            echo "### PHPUnit — WP ${{ matrix.wordpress }}, PHP ${{ matrix.php }}"
            for suite in unit security; do
              if [ -f "$RUNNER_TEMP/$suite.out" ]; then
                echo "**${suite} suite**"
                echo '```'
                grep -E '^(Tests:|OK \(|[0-9]+\) )|FAILURES|ERRORS|Risky' "$RUNNER_TEMP/$suite.out" || echo "(no PHPUnit summary line found — see job log)"
                echo '```'
              else
                echo "**${suite} suite**: did not run (step failed before start)"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

  validate:
    name: Plugin validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - run: php tools/validate/validate-plugin.php

  mcp:
    name: MCP server build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      # npm ci (not npm install): installs strictly from package-lock.json and
      # recreates .bin shims with executable bits — the previous failure mode
      # was committed node_modules with mode-644 shims (tsc: Permission denied).
      - run: npm ci
      - run: npm run build

  ui:
    name: Dashboard (UIUX) build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: UIUX
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: UIUX/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint . --ext .ts,.tsx
      - run: npx vite build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
