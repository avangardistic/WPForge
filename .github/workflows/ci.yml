# CI only: deployment/release is intentionally not automated here.
# Job names are branch-protection check names; change them deliberately.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # Explicit bash enables pipefail, so tee cannot hide a failing test.
    shell: bash

jobs:
  lint:
    name: PHPCS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2
      - uses: ramsey/composer-install@v4
      - run: composer lint

  syntax:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Check PHP syntax
        run: find wordpress tests tools -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

  test:
    name: PHPUnit (WP ${{ matrix.wordpress }}, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.1', wordpress: '6.7' }
          - { php: '8.3', wordpress: '6.7' }
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      WP_TESTS_DIR: /tmp/wordpress-tests-lib
      WP_CORE_DIR: /tmp/wordpress
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          coverage: none
          tools: composer:v2
      - uses: ramsey/composer-install@v4
      - name: Install WordPress test environment
        id: wp-env
        run: bash tools/ci/install-wp-tests.sh wordpress_test root root 127.0.0.1 '${{ matrix.wordpress }}'
      - name: Run unit tests
        id: unit
        run: composer test:unit 2>&1 | tee "$RUNNER_TEMP/unit.out"
      # Report both suites even when unit tests fail, without ignoring failures.
      - name: Run security tests
        id: security
        if: ${{ !cancelled() && steps.wp-env.outcome == 'success' }}
        run: composer test:security 2>&1 | tee "$RUNNER_TEMP/security.out"
      - name: Report test results
        if: ${{ !cancelled() }}
        env:
          TITLE: PHPUnit WP ${{ matrix.wordpress }} / PHP ${{ matrix.php }}
          UNIT_OUTCOME: ${{ steps.unit.outcome }}
          SECURITY_OUTCOME: ${{ steps.security.outcome }}
        run: bash tools/ci/report-tests.sh
      - name: Upload test logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: phpunit-logs-php${{ matrix.php }}-wp${{ matrix.wordpress }}
          path: |
            ${{ runner.temp }}/unit.out
            ${{ runner.temp }}/security.out
          retention-days: 7
          if-no-files-found: ignore

  validate:
    name: Plugin validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - run: php tools/validate/validate-plugin.php

  mcp:
    name: MCP server build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci --workspaces=false
      - run: npm run build --workspaces=false

  ui:
    name: Dashboard (UIUX) build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: UIUX
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: UIUX/package-lock.json
      # UIUX is a root workspace but has its own lockfile.
      - run: npm ci --workspaces=false
      - name: Type-check
        run: npm exec --workspaces=false --no -- tsc --noEmit
      - run: npm run lint --workspaces=false
      - run: npm run build --workspaces=false

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # .gitleaksignore lists only eight verified historical placeholders.
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_ENABLE_COMMENTS: 'false'
      # The action limits push/PR scans to the event range. Also scan every
      # commit reachable from HEAD, including non-first-parent commits.
      - name: Scan reachable history
        run: gitleaks detect --redact --exit-code=2 --report-format=sarif --report-path="$RUNNER_TEMP/gitleaks-history.sarif"
      - name: Upload history scan report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-history-sarif
          path: ${{ runner.temp }}/gitleaks-history.sarif
          retention-days: 7
          if-no-files-found: ignore
